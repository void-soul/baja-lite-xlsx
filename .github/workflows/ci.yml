name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # --ignore-scripts skips the native "install"/"postinstall" scripts;
      # no package.json surgery needed.
      - run: npm install --ignore-scripts
      - name: Syntax-check all JS files
        run: |
          for f in index.js test/test.js scripts/*.js scripts/lib/*.js examples/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - name: Typecheck declarations
        # @types/node comes from devDependencies. "-p" is required: bare
        # "npx typescript@5 tsc" cannot resolve the tsc binary.
        run: npx --yes -p typescript@5 tsc --noEmit --skipLibCheck --types node index.d.ts

  build-test:
    name: Build & test (windows)
    # windows-2022 ships VS 2022, which node-gyp 10.x recognizes.
    # windows-latest moved to VS 2026 (v18) which node-gyp 10.x cannot find.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The runners' preinstalled vcpkg is too old for the preinstalled
      # MSVC 18 toolchain (cmake/ninja configure failures), so use a fresh
      # vcpkg checkout -- the same setup that made the tag release job's
      # "vcpkg install" step succeed.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg-ci
            vcpkg-bincache
          key: vcpkg-master-xlnt-libzip-x64-windows
      - name: Set up vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg-ci\.git)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg-ci
          }
          & C:\vcpkg-ci\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=C:\vcpkg-ci" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:GITHUB_WORKSPACE\vcpkg-bincache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install xlnt:x64-windows libzip:x64-windows --recurse
      - name: Install JS dependencies
        run: npm install --ignore-scripts
      - name: Build native addon
        run: npm run build
      - name: Copy runtime DLLs
        run: node scripts/package-dlls.js
      - name: Test
        run: npm test

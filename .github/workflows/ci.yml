name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # --ignore-scripts skips the native "install"/"postinstall" scripts;
      # no package.json surgery needed.
      - run: npm install --ignore-scripts
      - name: Syntax-check all JS files
        run: |
          for f in index.js test/test.js bench/*.js scripts/*.js scripts/lib/*.js examples/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - name: Typecheck declarations
        # @types/node comes from devDependencies. "-p" is required: bare
        # "npx typescript@5 tsc" cannot resolve the tsc binary.
        run: npx --yes -p typescript@5 tsc --noEmit --skipLibCheck --types node index.d.ts

  build-test:
    name: Build & test (windows)
    # windows-2022 ships VS 2022, which node-gyp 10.x recognizes.
    # windows-latest moved to VS 2026 (v18) which node-gyp 10.x cannot find.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The runners' preinstalled vcpkg is too old for modern MSVC
      # toolchains, so this action checks out a fresh vcpkg and installs
      # xlnt + libzip for the current platform/triplet.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg
            vcpkg-bincache
          key: vcpkg-master-win32-x64
      - name: Setup vcpkg (xlnt + libzip)
        uses: ./.github/actions/setup-vcpkg
      - name: Install JS dependencies
        run: npm install --ignore-scripts
      - name: Build native addon
        run: npm run build
      - name: Copy runtime DLLs
        run: node scripts/package-dlls.js
      - name: Verify addon loads (reports missing DLLs)
        run: node -e "require('./build/Release/baja_xlsx.node'); console.log('addon loads OK')"
      - name: Test
        run: npm test
      # Keeps the benchmark script working as the API grows (it covers the
      # write scenarios too); the numbers themselves are not asserted.
      - name: Benchmark smoke run
        run: npm run bench -- --iterations 1 --rows 500

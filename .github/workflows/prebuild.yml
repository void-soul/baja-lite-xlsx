name: Prebuild Native Module

# Builds the N-API prebuilt binaries for every supported platform, attaches
# them to the GitHub Release and publishes the package to npm.
#
# Why no per-Node/per-Electron-version jobs: the addon is built as N-API v8
# (ABI-stable), so ONE binary per platform+arch serves every Node.js >= 16
# and every Electron version, including future ones.
#
# Platform coverage: Windows x64, Linux x64 (+ arm64), macOS arm64 (+ x64).
# The two "experimental" entries use newer runner labels; they are allowed to
# fail without blocking the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
            experimental: true
          - name: darwin-arm64
            os: macos-latest
          - name: darwin-x64
            os: macos-15-intel
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg
            vcpkg-bincache
          key: vcpkg-master-${{ matrix.name }}

      - name: Setup vcpkg (xlnt + libzip)
        uses: ./.github/actions/setup-vcpkg

      - name: Remove stale prebuild archives
        shell: bash
        run: rm -rf prebuilds

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Create prebuild packages (napi + electron, Windows DLLs bundled)
        run: npm run prebuilds

      - name: Ensure a Release build exists for the tests
        shell: bash
        run: |
          set -e
          if [ ! -f build/Release/baja_xlsx.node ]; then
            npm run build
            node scripts/package-dlls.js || true
          fi

      - name: Verify the addon loads
        run: node -e "require('./build/Release/baja_xlsx.node'); console.log('addon loads OK')"

      - name: Run tests
        run: npm test

      - name: Verify prebuild archives
        run: node scripts/verify-prebuild.js prebuilds

      - name: List generated files
        shell: bash
        run: ls -la prebuilds/

      - name: Upload prebuild archives
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.name }}
          path: prebuilds/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds

      - name: List files to be released
        run: ls -la prebuilds/

      - name: Generate checksums
        run: node scripts/generate-checksums.js

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Only assets for THIS tag version; prebuilds/ in the repo may hold
          # archives from earlier releases (they must not be re-published).
          files: |
            prebuilds/*-${{ github.ref_name }}*.tar.gz
            prebuilds/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    # Publishes the npm package AFTER the GitHub release assets exist, so a
    # fresh `npm install baja-lite-xlsx@<version>` can immediately download
    # the matching prebuilt binary from the release.
    #
    # Uses npm Trusted Publishing (OIDC) -- no NPM_TOKEN secret required.
    # One-time setup on npmjs.com:
    #   package page -> Settings -> Trusted Publisher -> GitHub Actions
    #     Organization/user: void-soul
    #     Repository:        baja-lite-xlsx
    #     Workflow filename: prebuild.yml
    #     Environment:       (leave empty)
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Check whether this version is already on npm
        id: registry
        run: |
          if npm view "baja-lite-xlsx@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        if: steps.registry.outputs.published == 'false'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
